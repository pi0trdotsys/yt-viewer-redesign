name: yt-viewer

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Logowanie — 3 profile (wymagane w produkcji — server.ts odmawia bez tego)
      AUTH_USER_1: ${AUTH_USER_1:?set AUTH_USER_1 in .env}
      AUTH_PASSWORD_SHA256_1: ${AUTH_PASSWORD_SHA256_1:?set AUTH_PASSWORD_SHA256_1 in .env}
      AUTH_NAME_1: ${AUTH_NAME_1:-}
      AUTH_AVATAR_1: ${AUTH_AVATAR_1:-}
      AUTH_ACCENT_1: ${AUTH_ACCENT_1:-}
      AUTH_USER_2: ${AUTH_USER_2:?set AUTH_USER_2 in .env}
      AUTH_PASSWORD_SHA256_2: ${AUTH_PASSWORD_SHA256_2:?set AUTH_PASSWORD_SHA256_2 in .env}
      AUTH_NAME_2: ${AUTH_NAME_2:-}
      AUTH_AVATAR_2: ${AUTH_AVATAR_2:-}
      AUTH_ACCENT_2: ${AUTH_ACCENT_2:-}
      AUTH_USER_3: ${AUTH_USER_3:?set AUTH_USER_3 in .env}
      AUTH_PASSWORD_SHA256_3: ${AUTH_PASSWORD_SHA256_3:?set AUTH_PASSWORD_SHA256_3 in .env}
      AUTH_NAME_3: ${AUTH_NAME_3:-}
      AUTH_AVATAR_3: ${AUTH_AVATAR_3:-}
      AUTH_ACCENT_3: ${AUTH_ACCENT_3:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Gateway → worker
      WORKER_URL: http://worker:8081
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
    depends_on:
      worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      PORT: 8081
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-2}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-25}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-21600}
      STREAM_TICKET_TTL_SEC: ${STREAM_TICKET_TTL_SEC:-120}
      # Opcjonalnie: patrz komentarz przy COOKIES_FILE w .env.example.
      COOKIES_FILE: ${COOKIES_FILE:-}
    # Pliki wynikowe nigdy nie trafiają na dysk (strumień prosto do
    # przeglądarki) — jedyny sensowny wolumen to opcjonalny cookies.txt.
    # Odkomentuj oba wiersze poniżej, jeśli ustawiasz COOKIES_FILE=/data/cookies.txt:
    # volumes:
    #   - ./cookies.txt:/data/cookies.txt:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)throw 0})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app
